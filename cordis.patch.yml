# dsh-mworks-ai bundle patch
#
# One row: this bundle's Host plugin. It contributes the two official MWORKS
# MCP servers through the Host's MCP manager (ctx.mcpManager.register), which is
# why there are no bare @deepseek-ai/dsh-mcp-client rows here.
#
# Owning the servers through the manager is deliberate:
#   - their connection state is readable, so a server that stopped answering is
#     visible instead of silently swallowing every call until its timeout;
#   - one of them can be rebuilt in place (mcpManager.restart), which remounts
#     the child and re-attaches it to the running Sysplorer engine. Without
#     that, a child whose engine was restarted underneath it stays alive but
#     detached — it emits no close or error, so the client bridge has nothing to
#     reconnect on.
#
# Server definitions (command, args, env, cwd, timeouts, reconnect) live in
# lib/index.js, in the SERVERS table. Startup parameters were verified against
# the installed servers:
#   - Syslab needs --syslab-root (the server panics without it) and must run
#     --syslab-display-mode=nodesktop, or Julia calls attach to an already open
#     Syslab desktop and leave stray processes behind.
#   - Sysplorer must start through Tools/sysplorer_mcp/main.py, the launcher
#     that exports MCP_DEPLOY_ROOT; starting the inner main.py breaks
#     resources_retrieval while tools/list still looks healthy.
#
# This patch needs a profile that mounts @deepseek-ai/dsh-mcp-manager (the Web
# and Desktop profiles do). Without it the plugin still loads, `mworks_environment`
# says the servers cannot be reported or repaired, and no MWORKS MCP tools exist.

- insert:
    - id: dsh-mworks-ai
      name: dsh-mworks-ai
